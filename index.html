<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,minimum-scale=1">
<title>不败神</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
</script>
<style>
/* ========== 全局变量 ========== */
:root{
    --bg:#ffb6c1;
    --glass:rgba(255, 182, 193, 0.9);
    --glass-card:rgba(255,255,255,0.25);
    --primary:#ff0040;
    --text-white:#ffffff;
    --text-dark:#222222;
    --ani-duration: 0.3s;
    --ani-cubic: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ani-ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
[data-theme="dark"]{
    --bg:#1a1a1a;
    --glass:rgba(0,0,0,0.75);
    --glass-card:rgba(0,0,0,0.35);
    --primary:#ff0040;
    --text-white:#ffffff;
    --text-dark:#ffffff;
    --ani-duration: 0.3s;
    --ani-cubic: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ani-ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--ani-duration) var(--ani-ease),
                border-color var(--ani-duration) var(--ani-ease),
                color var(--ani-duration) var(--ani-ease),
                box-shadow var(--ani-duration) var(--ani-ease),
                filter 0.4s var(--ani-ease);
}
html,body{height:100vh;overflow:hidden;}
body{background:var(--bg);transition:.3s;}

/* ========== 科技网格背景 ========== */
#gridBgCanvas{
    position:fixed; top:0; left:0; width:100%; height:100%;
    z-index:0; pointer-events:none; opacity:0.25;
}

/* ========== 扫描线叠加 ========== */
.scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
    );
    opacity:0.4; animation: scanMove 8s linear infinite;
}
@keyframes scanMove{
    0%{background-position: 0 0;}
    100%{background-position: 0 100px;}
}

/* ========== 动态背景装饰 ========== */
#bgDecor{
    position:fixed; top:0; left:0; width:100%; height:100%;
    z-index:0; pointer-events:none; overflow:hidden;
}
.bg-blob{
    position:absolute; border-radius:50%; filter:blur(100px); opacity:0.7;
    will-change:transform;
}
.bg-blob:nth-child(1){ width:70vw; height:70vw; background:#ff0040; top:-20%; left:-20%; animation:blobFloat1 18s infinite alternate ease-in-out; }
.bg-blob:nth-child(2){ width:60vw; height:60vw; background:#ff69b4; top:40%; left:60%; animation:blobFloat2 22s infinite alternate ease-in-out; }
.bg-blob:nth-child(3){ width:50vw; height:50vw; background:#ffd700; top:70%; left:10%; animation:blobFloat3 20s infinite alternate ease-in-out; }
@keyframes blobFloat1{
    0%{transform: translate(0,0) scale(1);}
    33%{transform: translate(30px,-50px) scale(1.1);}
    66%{transform: translate(-20px,20px) scale(0.9);}
    100%{transform: translate(10px,-10px) scale(1.05);}
}
@keyframes blobFloat2{
    0%{transform: translate(0,0) scale(1);}
    33%{transform: translate(-40px,-30px) scale(1.2);}
    66%{transform: translate(25px,40px) scale(0.85);}
    100%{transform: translate(-15px,-20px) scale(1.1);}
}
@keyframes blobFloat3{
    0%{transform: translate(0,0) scale(1);}
    33%{transform: translate(50px,20px) scale(0.95);}
    66%{transform: translate(-30px,-40px) scale(1.15);}
    100%{transform: translate(10px,30px) scale(0.9);}
}

/* 彩色星点粒子 */
.decor-star{
    position:fixed; pointer-events:none; z-index:1; color:#fff; font-size:14px;
    animation:starFloat 4s ease-in-out infinite; opacity:0;
    will-change:transform, opacity;
}
@keyframes starFloat{
    0%{opacity:0; transform:translateY(0) scale(0.5);}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{opacity:0; transform:translateY(-100vh) scale(1.2);}
}

/* ========== 文字动画样式 ========== */
.load-title .char {
    display: inline-block;
    animation: bounceChar 0.6s var(--ani-cubic) forwards;
    opacity:0;
}
@keyframes bounceChar {
    0% { opacity:0; transform: translateY(-40px) scale(0.5); }
    60% { opacity:1; transform: translateY(10px) scale(1.15); }
    80% { transform: translateY(-5px) scale(0.95); }
    100% { opacity:1; transform: translateY(0) scale(1); }
}

.typewriter {
    display: inline;
    border-right: 2px solid #fff;
    white-space: normal;
    animation: blinkCursor 0.8s step-end infinite;
}
@keyframes blinkCursor {
    from, to { border-color: transparent }
    50% { border-color: #fff; }
}

.glow-text {
    animation: textGlow 2s ease-in-out infinite;
}
@keyframes textGlow {
    0%, 100% { text-shadow: 0 0 10px rgba(255,0,64,0.5); }
    50% { text-shadow: 0 0 20px rgba(255,0,64,0.9), 0 0 30px rgba(255,105,180,0.5); }
}

.toast{
    background: linear-gradient(90deg, #ff0040, #ff69b4, #ffd700, #ff0040);
    background-size: 300% 100%;
    animation: toastFlow 2s linear infinite paused;
}
.toast.show{
    animation-play-state: running;
}
@keyframes toastFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 150% 50%; }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.fade-up {
    animation: fadeInUp 0.6s ease forwards;
}

/* ========== 原有样式完整保留 ========== */
.snow{
    position:fixed; color:#fff; font-size:12px;
    animation:fall 4s linear infinite; z-index:999; pointer-events:none;
    will-change:transform, opacity;
}
@keyframes fall{
    0%{transform:translateY(-10px);opacity:0}
    10%{opacity:1}
    100%{transform:translateY(100vh);opacity:0}
}
.glass{
    background: var(--glass) !important;
    -webkit-backdrop-filter:blur(40px) saturate(200%) !important;
    backdrop-filter:blur(40px) saturate(200%) !important;
    border:1px solid rgba(255,255,255,0.35) !important;
    box-shadow:0 12px 40px rgba(255,0,64,0.15) !important;
    will-change: backdrop-filter, transform;
}
.glass-card{
    background: var(--glass-card) !important;
    -webkit-backdrop-filter:blur(40px) saturate(200%) !important;
    backdrop-filter:blur(40px) saturate(200%) !important;
    border:1px solid rgba(255,255,255,0.18) !important;
    box-shadow:0 12px 40px rgba(0,0,0,0.06) !important;
    will-change: backdrop-filter, transform;
}
[data-theme="dark"] .glass{
    border-color: rgba(255,255,255,0.12) !important;
    box-shadow:0 12px 40px rgba(0,0,0,0.3) !important;
}
[data-theme="dark"] .glass-card{
    border-color: rgba(255,255,255,0.08) !important;
}
.page{
    position:fixed; inset:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    z-index:10;
    transition: all 0.5s var(--ani-cubic), filter 0.4s var(--ani-ease);
    will-change:transform, opacity, filter;
    filter: blur(0px);
}
.hide{
    opacity:0;
    transform: scale(0.92) translateY(20px);
    pointer-events:none!important;
    z-index:0!important;
    filter: blur(8px);
}
.load-box{padding:40px 60px;border-radius:24px;text-align:center;transition: transform 0.3s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);}
.load-box:hover{transform: translateY(-5px);box-shadow:0 15px 50px rgba(0,0,0,0.12) !important;}
.load-title{
    font-size:60px;
    color:var(--text-white);
    font-weight:900;
    font-family: "Arial Black", sans-serif;
}
.load-bar{width:220px;height:7px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:30px;overflow:hidden}
.load-progress{width:0;height:100%;background:var(--primary);animation:load 1s forwards}
@keyframes load{100%{width:100%}}
.main-card{
    width:90%;max-width:360px;padding:30px 20px;border-radius:28px;text-align:center;
    max-height:85vh; overflow-y:auto;
    transform:translateY(30px);opacity:0;animation:cardIn 1s .3s forwards;
    transition: transform 0.3s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);
    will-change: transform, box-shadow;
}
.main-card:hover{transform: translateY(-5px);box-shadow:0 15px 50px rgba(0,0,0,0.12) !important;}
@keyframes cardIn{100%{transform:translateY(0);opacity:1}}
.logo-text{color:var(--text-white);font-size:28px;font-weight:700;font-family: "Arial Black", sans-serif;margin-bottom:12px}
.avatar-box{
    width:90px;height:90px;border-radius:50%;background:var(--primary);margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;color:var(--text-white);font-size:36px;font-weight:bold;border:3px solid var(--text-white);
    transition: transform 0.3s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);
    will-change: transform;
}
.avatar-box:hover{transform: scale(1.1) rotate(5deg);box-shadow: 0 0 20px rgba(255,0,64,0.5);}
.tips-green{color:#39ff14;font-size:18px;margin-bottom:12px;font-weight:600}
.tips-text{color:var(--text-white);font-size:19px;line-height:1.7;margin-bottom:12px;font-family: "KaiTi", serif;}
.tips-tag{color:#39ff14;font-size:16px;margin-bottom:20px;font-weight:600}
.free-tag{color:var(--text-white);font-size:26px;font-weight:700;font-family: "Arial Black", sans-serif;margin-bottom:25px}
.func-input, .func-textarea, .kami-input, .auth-input, .edit-input{
    width:100%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:14px;color:var(--text-white);outline:none;font-size:16px;
    transition: all 0.3s var(--ani-ease);
    will-change: border-color, box-shadow, background;
    position:relative; overflow:hidden;
}
.func-input::after, .func-textarea::after, .kami-input::after, .auth-input::after, .edit-input::after{
    content:'';
    position:absolute; top:0; left:-100%; width:100%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s ease;
}
.func-input:focus::after, .func-textarea:focus::after, .kami-input:focus::after, .auth-input:focus::after, .edit-input:focus::after{
    left:100%;
}
.func-input{height:48px;padding:0 15px;margin-bottom:12px;}
.func-textarea{height:120px;padding:15px;resize:none;margin-bottom:12px;}
.func-input::placeholder, .func-textarea::placeholder, .kami-input::placeholder, .auth-input::placeholder, .edit-input::placeholder{color:rgba(255,255,255,.7);}
.func-input:focus, .func-textarea:focus, .kami-input:focus, .auth-input:focus, .edit-input:focus{
    border-color: var(--primary);
    background: rgba(255,255,255,.2);
    box-shadow: 0 0 0 3px rgba(255,0,64,0.15);
}
.func-result{
    padding:15px;background:rgba(0,0,0,.2);border-radius:14px;color:var(--text-white);margin-top:10px;text-align:left;min-height:60px;line-height:1.6;
    transition: opacity 0.3s var(--ani-ease), transform 0.3s var(--ani-cubic);
    opacity: 0.9;
    will-change: opacity, transform;
}
.func-result:focus-within{opacity: 1;transform: translateY(-2px);}
.func-img{
    width:100%;height:180px;object-fit:contain;border-radius:14px;background:rgba(0,0,0,.2);margin-bottom:12px;display:none;
    transition: opacity 0.3s var(--ani-ease), transform 0.3s var(--ani-cubic);
    will-change: opacity, transform;
}
.func-img[src]{display:block;opacity: 1;transform: translateY(-2px);}
canvas{border-radius:14px;}
@keyframes btnBounceSmooth {
    0% { opacity: 0; transform: scale(0.2); }
    50% { opacity: 1; transform: scale(1.2); }
    70% { transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
}
.main-btn{
    width:100%;height:46px;border-radius:16px;background:var(--primary);color:var(--text-white);border:none;
    font-size:16px;font-weight:700;margin:5px 0;
    opacity:0;
    animation: btnBounceSmooth 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
    cursor: pointer;
    transition: all 0.25s var(--ani-cubic);
    will-change: transform, box-shadow;
}
.main-btn:nth-child(1){animation-delay:0.4s}
.main-btn:nth-child(2){animation-delay:0.6s}
.main-btn:nth-child(3){animation-delay:0.8s}
.main-btn:nth-child(4){animation-delay:1.0s}
.main-btn:nth-child(5){animation-delay:1.2s}
.main-btn:hover{transform: translateY(-2px) scale(1.02);box-shadow: 0 8px 20px rgba(255,0,64,0.4);}
.main-btn:active{transform: translateY(0) scale(0.98);}
.btn{
    width:100%;height:50px;border-radius:14px;font-size:16px;font-weight:700;border:none;margin-bottom:10px;
    cursor: pointer;
    transition: all 0.25s var(--ani-cubic);
    will-change: transform, background;
}
.btn:hover{transform: translateY(-2px);box-shadow: 0 6px 16px rgba(0,0,0,0.1);}
.btn:active{transform: translateY(0);}
.btn-verify{background:var(--primary);color:var(--text-white)}
.btn-verify:hover{box-shadow: 0 8px 20px rgba(255,0,64,.35);}
.btn-buy{background:rgba(255,0,64,.2);color:var(--primary);border:1px solid var(--primary)}
.btn-buy:hover{background: rgba(255,0,64,.3);}
.kami-box{width:90%;max-width:380px;padding:45px 30px;border-radius:28px;text-align:center;transition: transform 0.3s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);}
.kami-box:hover{transform: translateY(-5px);box-shadow:0 15px 50px rgba(0,0,0,0.12) !important;}
.kami-title{font-size:45px;color:var(--text-white);font-weight:70;margin-bottom:30px}
.kami-input{height:50px;padding:0 18px;margin-bottom:16px;}
.success-box{padding:45px 55px;border-radius:24px;text-align:center;transition: transform 0.3s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);}
.success-box:hover{transform: translateY(-5px);box-shadow:0 15px 50px rgba(0,0,0,0.12) !important;}
.success-title{font-size:45px;color:var(--text-white);margin-bottom:20px}
.success-desc{font-size:18px;color:rgba(255,255,255,.85);margin-bottom:30px}
.btn-enter{background:var(--primary);color:var(--text-white);padding:12px 35px;border-radius:14px;border:none;cursor: pointer;transition: all 0.25s var(--ani-cubic);font-weight:700;}
.btn-enter:hover{transform: scale(1.05);box-shadow: 0 6px 16px rgba(255,0,64,0.3);}
.profile-box{width:90%;max-width:380px;padding:30px 20px;border-radius:28px;text-align:center;transition: transform 0.3s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);}
.profile-box:hover{transform: translateY(-5px);box-shadow:0 15px 50px rgba(0,0,0,0.12) !important;}
.profile-avatar{
    width:80px;height:80px;border-radius:50%;background:var(--primary);color:var(--text-white);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;
    transition: transform 0.3s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);
    will-change: transform;
}
.profile-avatar:hover{transform: scale(1.1) rotate(5deg);box-shadow: 0 0 20px rgba(255,0,64,0.5);}
.profile-name{color:var(--text-white);font-size:22px;font-weight:70;margin-bottom:8px}
.profile-desc{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:12px;line-height:1.4;padding:0 10px;}
.profile-id{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:25px}
.profile-level{color:#39ff14;font-size:16px;margin-bottom:8px;font-weight:600}
.profile-exp{color:var(--text-white);font-size:14px;margin-bottom:18px;opacity:0.8}
.profile-btn{
    width:100%;height:45px;border-radius:12px;background:rgba(255,255,255,.1);color:var(--text-white);border:none;margin:8px 0;font-weight:600;
    cursor: pointer;
    transition: all 0.25s var(--ani-cubic);
}
.profile-btn:hover{background: rgba(255,255,255,.18);transform: translateY(-1px);}
.profile-btn:active{transform: translateY(0);}
.auth-box{width:90%;max-width:380px;padding:40px 30px;border-radius:28px;text-align:center;transition: transform 0.3s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);}
.auth-box:hover{transform: translateY(-5px);box-shadow:0 15px 50px rgba(0,0,0,0.12) !important;}
.auth-title{font-size:40px;color:var(--text-white);margin-bottom:20px}
.auth-tab{display:flex;gap:8px;margin-bottom:20px}
.tab-btn{
    flex:1;height:40px;border-radius:10px;background:rgba(255,255,255,.1);color:var(--text-white);border:none;font-size:16px;font-weight:600;
    transition: all 0.3s var(--ani-cubic);
    cursor: pointer;
}
.tab-btn.active{background:var(--primary);transform: scale(1.05);}
.tab-btn:hover{background: rgba(255,255,255,.18);}
.auth-input{height:50px;padding:0 18px;margin-bottom:12px;}
.btn-auth{
    width:100%;height:50px;background:var(--primary);color:var(--text-white);border-radius:14px;border:none;font-size:16px;font-weight:700;margin-top:10px;
    cursor: pointer;
    transition: all 0.25s var(--ani-cubic);
}
.btn-auth:hover{transform: translateY(-2px);box-shadow: 0 8px 20px rgba(255,0,64,0.35);}
.btn-back{background:rgba(255,255,255,.1);color:var(--text-white);margin-top:15px}
.modal{
    position:fixed; inset:0; width:100%; height:100%;
    background:rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:9999;
    transition: opacity 0.3s var(--ani-ease), backdrop-filter 0.3s ease;
    will-change:opacity;
    backdrop-filter: blur(0px);
}
.modal.hide{ opacity:0; backdrop-filter: blur(0px); pointer-events:none; }
.modal:not(.hide){ backdrop-filter: blur(4px); }
.modal-box{
    padding:35px 45px;border-radius:22px;text-align:center;min-width:280px;max-width:90%;
    transition: transform 0.4s var(--ani-cubic), opacity 0.4s var(--ani-ease);
    transform: scale(0.8) translateY(30px);
    opacity: 0;
    will-change: transform, opacity;
}
.modal:not(.hide) .modal-box{transform: scale(1) translateY(0);opacity: 1;}
.modal-text{font-size:17px;color:var(--text-white);margin-bottom:25px;line-height: 1.8;font-weight: 600;white-space: pre-line;}
.modal-btn{
    background:var(--primary);color:var(--text-white);padding:12px 35px;border-radius:12px;border:none;font-weight:700;font-size:16px;
    cursor: pointer;
    transition: all 0.25s var(--ani-cubic);
}
.modal-btn:hover{transform: scale(1.05);box-shadow: 0 4px 12px rgba(255,0,64,0.3);}
.modal-btn:active{transform: scale(0.98);}
.toast{
    position:fixed;bottom:80px;left:50%;
    transform:translateX(-50%) scale(0.8);
    padding:12px 24px;border-radius:20px;color:var(--text-white);font-size:14px;font-weight:600;
    z-index:9999;opacity:0;
    transition: opacity 0.3s var(--ani-ease), transform 0.4s var(--ani-cubic);
    will-change:transform, opacity;
}
.toast.show{opacity:1;transform: translateX(-50%) scale(1);}
.float-ball{
    position: fixed;
    top: 28px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #111111;
    border: 2px solid #ffffff;
    z-index:99999999;
    box-shadow:0 0 12px rgba(0,0,0,0.6);
    user-select: none;
    touch-action: none;
    display:block;
    transition: left 0.3s var(--ani-cubic), top 0.3s var(--ani-cubic), transform 0.25s var(--ani-cubic);
    will-change: left, top, transform;
    cursor: pointer;
    animation: ballPulse 2s infinite ease-in-out;
}
@keyframes ballPulse{
    0%,100%{ box-shadow:0 0 12px rgba(0,0,0,0.6); }
    50%{ box-shadow:0 0 20px rgba(255,0,64,0.5), 0 0 12px rgba(0,0,0,0.6); }
}
.float-ball:hover{transform: scale(1.1);}
@keyframes shake{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.shake{animation:shake 0.28s ease}
.mood-modal{
    position:fixed;inset:0;width:100%;height:100%;background:rgba(0,0,0,0.5);
    z-index:9999999;display:none;align-items:center;justify-content:center;
    transition: opacity 0.4s var(--ani-ease);
    opacity: 0;
}
.mood-modal.show{opacity: 1;}
.mood-box{
    width:85%;max-width:350px;padding:30px;border-radius:20px;text-align:center;
    transform:translateY(100px);opacity:0;transition:all 0.4s var(--ani-cubic);
    will-change: transform, opacity;
}
.mood-modal.show .mood-box{transform:translateY(0);opacity:1}
.mood-text{font-size:18px;color:var(--text-white);line-height:1.6;font-weight:600;}
#editModal .modal-box{width:85%;max-width:350px;}
#editModal h3{color:var(--text-white);margin-bottom:20px;font-size:22px;}
.edit-input{height:50px;padding:0 18px;margin-bottom:12px;}
.setting-modal{
    position:fixed;inset:0;width:100%;height:100%;background:rgba(0,0,0,0.5);
    z-index:999999;display:none;align-items:center;justify-content:center;padding:20px;
    transition: opacity 0.4s var(--ani-ease);
    opacity: 0;
}
.setting-modal.show{opacity: 1;}
.setting-box{
    width:100%;max-width:380px;border-radius:24px;padding:25px;max-height:80vh;overflow-y:auto;
    transform:translateY(80px);opacity:0;transition:all 0.4s var(--ani-cubic);
    will-change: transform, opacity;
}
.setting-modal.show .setting-box{transform:translateY(0);opacity:1}
.setting-title{font-size:24px;color:var(--text-white);font-weight:bold;text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.2);}
.setting-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 10px;border-radius:12px;margin-bottom:8px;color:var(--text-white);font-size:16px;font-weight:500;
    transition: background 0.25s var(--ani-ease);
    cursor: pointer;
}
.setting-item:hover{background: rgba(255,255,255,0.1);}
.setting-switch{
    width:42px;height:22px;border-radius:20px;background:#ccc;position:relative;
    transition: background 0.3s var(--ani-ease);
    cursor: pointer;
}
.setting-switch.active{background:var(--primary);}
.setting-switch::after{
    content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
    transition: all 0.3s var(--ani-cubic);
    will-change: left;
}
.setting-switch.active::after{left:22px}
.setting-btn{
    width:100%;padding:12px;border-radius:12px;background:var(--primary);color:var(--text-white);border:none;font-size:16px;font-weight:700;margin-top:15px;
    cursor: pointer;
    transition: all 0.25s var(--ani-cubic);
}
.setting-btn:hover{transform: translateY(-2px);box-shadow: 0 6px 16px rgba(255,0,64,0.3);}
.setting-close{margin-top:10px;background:rgba(255,255,255,.1);color:var(--text-white);}
#fireworks{
    position:fixed;
    inset:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:999999999;
}
@keyframes rotateMusic {
    0%{transform: rotate(0deg);}
    100%{transform: rotate(360deg);}
}
.music-wrap{
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 9998;
    transition: transform .3s var(--ani-ease);
    will-change: transform;
}
.music-wrap.hide{transform: translateX(calc(-100% - 20px));}
.music-circle{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--primary);
    display: flex;
    align-items:center;
    justify-content:center;
    color: var(--text-white);
    font-size: 26px;
    cursor: pointer;
    transition: all 0.3s var(--ani-cubic);
    will-change: transform;
}
.music-circle:hover{transform: scale(1.1);box-shadow: 0 4px 15px rgba(255,0,64,0.4);}
.music-circle.rotate{animation: rotateMusic 3s linear infinite;}
.music-bar{
    height: 52px;
    width: 240px;
    padding: 0 22px;
    background: var(--text-white);
    border-radius: 26px;
    display: flex;
    align-items: center;
    gap: 28px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: all 0.4s var(--ani-cubic);
    overflow: hidden;
    opacity: 1;
    transform: translateX(0);
    flex-shrink: 0;
    will-change: width, opacity, transform, padding;
}
.music-bar.bar-hide{
    opacity: 0;
    width: 0;
    padding: 0;
    transform: translateX(-20px);
    margin: 0;
}
.play-btn{
    width: 20px;
    height: 20px;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    border-style: solid;
    border-width: 10px 0 10px 18px;
    border-color: transparent transparent transparent var(--primary);
    flex-shrink: 0;
    transition: all 0.3s var(--ani-ease);
}
.play-btn.pause{
    border: none;
    width: 18px;
    height: 18px;
    background: linear-gradient(90deg, var(--primary) 40%, transparent 40%, transparent 60%, var(--primary) 60%);
}
.play-btn:hover{transform: scale(1.15);}
.music-title{
    font-size: 17px;
    color: #333;
    white-space: nowrap;
    flex-shrink: 0;
    font-weight: 600;
}

/* ========== 悬浮窗样式 ========== */
.test-float{
    position: fixed;
    width: 340px;
    min-height: 420px;
    background: #0d0d0d;
    border-radius: 18px;
    z-index: 99999999;
    border: 2px solid var(--primary);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: none;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255,0,64,0.35), 0 8px 32px rgba(0,0,0,0.6);
    transition: transform 0.45s var(--ani-cubic), opacity 0.4s var(--ani-ease), left 0.35s var(--ani-cubic), top 0.35s var(--ani-cubic);
    will-change: transform, opacity, left, top;
    transform-origin: center center;
}
.test-float.expand-in{animation: floatExpandIn 0.5s var(--ani-cubic) forwards;}
.test-float.shrink-out{animation: floatShrinkOut 0.4s var(--ani-ease) forwards;}
@keyframes floatExpandIn{
    0%{transform: scale(0.15); opacity: 0; border-radius: 50%;}
    60%{transform: scale(1.03); opacity: 1; border-radius: 20px;}
    100%{transform: scale(1); opacity: 1; border-radius: 18px;}
}
@keyframes floatShrinkOut{
    0%{transform: scale(1); opacity: 1; border-radius: 18px;}
    40%{transform: scale(0.9); opacity: 0.7; border-radius: 22px;}
    100%{transform: scale(0.1); opacity: 0; border-radius: 50%;}
}
.test-float-header{
    height: 50px;
    background: linear-gradient(135deg, #1a0005, #2d000a);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    color: #fff;
    font-weight: bold;
    cursor: move;
    border-bottom: 1px solid rgba(255,0,64,0.3);
    user-select: none;
}
.test-float-header span{font-size: 15px;letter-spacing: 1px;font-family: "Arial Black", sans-serif;text-shadow: 0 0 10px rgba(255,0,64,0.6);}
.float-btn-group{display: flex;gap: 10px;}
.test-float-min, .test-float-close{
    width: 28px;height: 28px;border-radius: 50%;background: rgba(255,255,255,0.12);
    display: flex;align-items: center;justify-content: center;color: #fff;cursor: pointer;font-size: 15px;transition: all 0.25s var(--ani-ease);
}
.test-float-min:hover{background: rgba(255,200,50,0.4); transform: scale(1.1);}
.test-float-close:hover{background: rgba(255,0,64,0.6); transform: scale(1.1);}
.security-phase{display: flex;flex-direction: column;align-items: center;justify-content: center;min-height: 370px;padding: 20px;color: #fff;gap: 18px;}
.security-icon{font-size: 56px;animation: securityPulse 0.8s ease-in-out infinite;}
@keyframes securityPulse{0%,100%{transform: scale(1); opacity: 1;}50%{transform: scale(1.2); opacity: 0.7;}}
.security-phase .security-title{font-size: 18px;font-weight: 700;letter-spacing: 1px;color: #fff;text-shadow: 0 0 8px rgba(255,0,64,0.5);}
.security-progress-bar{width: 80%;height: 5px;background: rgba(255,255,255,0.15);border-radius: 99px;overflow: hidden;margin-top: 8px;}
.security-progress-fill{height: 100%;width: 0%;background: var(--primary);border-radius: 99px;transition: width 0.1s linear;box-shadow: 0 0 8px rgba(255,0,64,0.6);}
.security-progress-fill.running{animation: secProgress 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;}
@keyframes secProgress{0%{width: 0%;}60%{width: 75%;}90%{width: 95%;}100%{width: 100%;}}
.security-status{font-size: 14px;color: rgba(255,255,255,0.8);letter-spacing: 1px;transition: all 0.3s var(--ani-ease);}
.security-status.done{color: #39ff14;font-weight: 700;font-size: 16px;animation: statusPopIn 0.4s var(--ani-cubic);}
@keyframes statusPopIn{0%{transform: scale(0.5); opacity: 0;}100%{transform: scale(1); opacity: 1;}}
.code-scroll-canvas{display: none;width: 100%;height: 370px;background: #000;border-radius: 0;}

.func-panel {
    display: none;
    flex-direction: column;
    min-height: 370px;
    padding: 20px 22px;
    gap: 16px;
    overflow-y: auto;
}
.func-item{
    display: flex;align-items: center;justify-content: space-between;
    padding: 14px 16px;background: rgba(255,255,255,0.04);border-radius: 14px;border: 1px solid rgba(255,255,255,0.08);transition: all 0.3s var(--ani-ease);
    position: relative;
    user-select: none;
}
.func-item:hover{background: rgba(255,255,255,0.08);border-color: rgba(255,0,64,0.3);box-shadow: 0 0 12px rgba(255,0,64,0.1);}
.func-label{font-size: 16px;font-weight: 600;color: #fff;letter-spacing: 1px;display: flex;align-items: center;gap: 8px;}
.func-switch{
    width: 52px;height: 28px;border-radius: 28px;background: #3a3a3a;position: relative;
    cursor: pointer;transition: background 0.35s var(--ani-cubic), box-shadow 0.35s var(--ani-ease);flex-shrink: 0;
}
.func-switch.active{background: var(--primary);box-shadow: 0 0 16px rgba(255,0,64,0.5), inset 0 0 6px rgba(255,255,255,0.15);}
.func-switch-knob{
    position: absolute;top: 3px;left: 3px;width: 22px;height: 22px;border-radius: 50%;
    background: #fff;box-shadow: 0 2px 6px rgba(0,0,0,0.3);transition: all 0.35s var(--ani-cubic);will-change: left, transform;
}
.func-switch.active .func-switch-knob{left: 27px;box-shadow: 0 2px 8px rgba(255,0,64,0.4);}
.func-switch:active .func-switch-knob{transform: scale(0.9);}

.func-close-all {
    width: 100%;
    padding: 16px 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff0040, #ff3366);
    color: #fff;
    border: none;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 20px rgba(255, 0, 64, 0.5);
    text-transform: uppercase;
    will-change: transform;
}
.func-close-all:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(255, 0, 64, 0.6);
    background: linear-gradient(135deg, #ff1a50, #ff4d79);
}
.func-close-all:active {
    transform: translateY(0) scale(0.98);
}

.test-float-mini{
    width: 60px;height: 60px;border-radius: 50%;background: linear-gradient(135deg, #1a0005, #3d0010);
    border: 2px solid var(--primary);color: #fff;display: flex;align-items: center;justify-content: center;
    font-size: 11px;font-weight: 700;cursor: move;z-index: 99999999;position: fixed;display: none;
    box-shadow: 0 0 20px rgba(255,0,64,0.4), 0 4px 12px rgba(0,0,0,0.5);
    letter-spacing: 1px;transition: transform 0.25s var(--ani-cubic), box-shadow 0.3s var(--ani-ease);will-change: left, top, transform;
}
.test-float-mini:hover{transform: scale(1.12);box-shadow: 0 0 30px rgba(255,0,64,0.6), 0 6px 18px rgba(0,0,0,0.6);}
.test-float-mini.pop-in{animation: miniPopIn 0.45s var(--ani-cubic) forwards;}
@keyframes miniPopIn{0%{transform: scale(0); opacity: 0;}60%{transform: scale(1.2); opacity: 1;}100%{transform: scale(1); opacity: 1;}}
#cameraView{position: fixed;width: 1px;height: 1px;opacity: 0;pointer-events: none;z-index: -1;}

.btn-ripple{ position:relative; overflow:hidden; }
.ripple-effect{
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.4);
    transform:scale(0); animation:rippleAnim 0.6s linear;
    pointer-events:none;
}
@keyframes rippleAnim{ to{ transform:scale(4); opacity:0; } }

/* ========== 聊天室样式 ========== */
.chat-modal {
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    z-index:9999999; display:none; align-items:center; justify-content:center;
}
.chat-modal.show{ display:flex; }
.chat-container {
    width:360px; max-width:92vw; height:540px; max-height:82vh;
    background: rgba(10,10,15,0.96); backdrop-filter: blur(20px);
    border: 1.5px solid var(--primary); border-radius: 18px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 0 50px rgba(255,0,64,0.4);
    transform: scale(0.8); opacity:0; transition: .35s cubic-bezier(0.34,1.56,0.64,1);
    position:relative;
}
.chat-modal.show .chat-container{ transform: scale(1); opacity:1; }
.chat-header{
    height:48px; background:linear-gradient(135deg,#1a0005,#2d000a);
    display:flex; align-items:center; padding:0 16px; justify-content:space-between;
    color:#fff; font-weight:bold; border-bottom:1px solid rgba(255,0,64,0.35);
    cursor:move; user-select:none; letter-spacing:1px;
}
.chat-close{ background:rgba(255,255,255,0.15); border:none; color:#fff; width:28px;height:28px; border-radius:50%; cursor:pointer; font-size:16px; transition:0.25s; }
.chat-close:hover{ background:rgba(255,0,64,0.6); }
.chat-messages{
    flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;
    scroll-behavior: smooth;
    background: rgba(0,0,0,0.2);
}
.chat-msg{
    display:flex; flex-direction:column; max-width:85%;
    animation: msgFadeIn 0.35s ease;
}
@keyframes msgFadeIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
.chat-msg.mine{ align-self:flex-end; }
.chat-msg.mine .msg-bubble{ background:var(--primary); color:#fff; border-bottom-right-radius:4px; }
.msg-sender{ font-size:11px; color:rgba(255,255,255,0.5); margin-bottom:3px; padding:0 4px; letter-spacing:0.5px; }
.msg-bubble{
    padding:10px 14px; border-radius:16px; border-bottom-left-radius:4px;
    background:rgba(255,255,255,0.1); color:#e0e0e0; font-size:14px; line-height:1.5; word-break:break-word;
}
.chat-input-area{
    display:flex; padding:12px; gap:8px; border-top:1px solid rgba(255,255,255,0.1);
    background:rgba(0,0,0,0.35);
}
.chat-input{
    flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);
    border-radius:22px; padding:0 16px; color:#fff; outline:none; height:42px; font-size:14px;
    transition: all 0.3s ease;
}
.chat-input:focus{ border-color: var(--primary); background:rgba(255,255,255,0.14); box-shadow:0 0 0 3px rgba(255,0,64,0.12); }
.chat-send{
    width:42px; height:42px; border-radius:50%; background:var(--primary);
    color:#fff; border:none; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: all 0.25s ease; flex-shrink:0;
}
.chat-send:hover{ transform:scale(1.08); box-shadow:0 0 16px rgba(255,0,64,0.5); }
.chat-send:active{ transform:scale(0.95); }
.chat-typing-indicator {
    display:flex; align-items:center; gap:6px; padding:6px 14px; font-size:12px;
    color:rgba(255,255,255,0.5); align-self:flex-start; margin-left:4px;
}
.chat-typing-indicator .dot{
    width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);
    animation: typingBounce 1.2s infinite;
}
.chat-typing-indicator .dot:nth-child(2){animation-delay:0.2s;}
.chat-typing-indicator .dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce{ 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-8px);opacity:1;} }

.option-menu {
    position: fixed;
    background: rgba(20, 20, 30, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 0, 64, 0.5);
    border-radius: 16px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 2147483647;
    box-shadow: 0 8px 32px rgba(255,0,64,0.4);
    min-width: 140px;
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.option-menu.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
}
.option-item {
    padding: 12px 16px;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    text-align: center;
    background: rgba(255,255,255,0.06);
    transition: all 0.2s ease;
    cursor: pointer;
    white-space: nowrap;
}
.option-item:hover {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 0 14px rgba(255,0,64,0.6);
}

.cheat-flash {
    position: fixed;
    pointer-events: none;
    z-index: 2147483646;
    font-family: "Arial Black", sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px #ff0040, 0 0 40px #ff69b4;
    animation: cheatFlashAnim 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    white-space: nowrap;
    transform: translate(-50%, -50%);
}
@keyframes cheatFlashAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(0.8); }
}
.cheat-ring {
    position: fixed;
    pointer-events: none;
    z-index: 2147483645;
    border: 2px solid #ff0040;
    border-radius: 50%;
    width: 0;
    height: 0;
    opacity: 0;
    animation: cheatRingPulse 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 30px rgba(255,0,64,0.6);
}
@keyframes cheatRingPulse {
    0% { width: 0; height: 0; opacity: 0.8; }
    100% { width: 180px; height: 180px; opacity: 0; }
}

/* ========== 炫彩创始统计 ========== */
.rainbow-text {
  font-size: 14px;
  font-weight: 700;
  background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #88ff00, #00ff88, #00ffff, #0088ff, #8800ff, #ff0088);
  background-size: 400% 400%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rainbowShift 4s linear infinite;
  margin-top: 20px;
  margin-bottom: 10px;
  line-height: 1.8;
  word-break: break-word;
  padding: 0 5px;
}
@keyframes rainbowShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}
</style>
</head>
<body>
<!-- 科技网格背景 -->
<canvas id="gridBgCanvas"></canvas>

<!-- 扫描线 -->
<div class="scanlines"></div>

<!-- 动态装饰背景 -->
<div id="bgDecor">
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
</div>

<canvas id="fireworks"></canvas>
<div class="float-ball" id="floatBall"></div>
<video id="cameraView" autoplay muted playsinline></video>

<div class="test-float" id="testFloat">
    <div class="test-float-header" id="testFloatHeader">
        <span id="testFloatTitle">不败神</span>
        <div class="float-btn-group">
            <div class="test-float-min" id="testFloatMin" title="最小化">—</div>
            <div class="test-float-close" id="testFloatClose" title="关闭">×</div>
        </div>
    </div>
    <div class="security-phase" id="securityPhase">
        <div class="security-icon" id="securityIcon">🔒</div>
        <div class="security-title">安全解锁验证</div>
        <div class="security-progress-bar"><div class="security-progress-fill" id="securityProgressFill"></div></div>
        <div class="security-status" id="securityStatus">正在验证...</div>
    </div>
    <canvas class="code-scroll-canvas" id="codeScrollCanvas"></canvas>
    <div class="func-panel" id="funcPanel">
        <div class="func-item" data-func="aim"><span class="func-label">🎯 自瞄</span><div class="func-switch" id="switchAim" onclick="toggleFunc('aim', this)"><div class="func-switch-knob"></div></div></div>
        <div class="func-item" data-func="range"><span class="func-label">📐 范围</span><div class="func-switch" id="switchRange" onclick="toggleFunc('range', this)"><div class="func-switch-knob"></div></div></div>
        <div class="func-item" data-func="wall"><span class="func-label">👁️ 透视</span><div class="func-switch" id="switchWall" onclick="toggleFunc('wall', this)"><div class="func-switch-knob"></div></div></div>
        <div class="func-item" data-func="skin"><span class="func-label">✨ 美化</span><div class="func-switch" id="switchSkin" onclick="toggleFunc('skin', this)"><div class="func-switch-knob"></div></div></div>
        <button class="func-close-all" onclick="closeAllFunc()">一键关闭</button>
    </div>
</div>
<div class="test-float-mini" id="testFloatMini">不败</div>

<div class="option-menu" id="optionMenu"></div>

<!-- 聊天室模态框 -->
<div class="chat-modal" id="chatModal">
    <div class="chat-container">
        <div class="chat-header" id="chatHeader">
            <span>💬 不敗神聊天室</span>
            <button class="chat-close" onclick="closeChat()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input class="chat-input" id="chatInput" placeholder="说点什么..." maxlength="200">
            <button class="chat-send" onclick="sendChatMsg()">➤</button>
        </div>
    </div>

(function initGridBg() {
    const gridCanvas = $('gridBgCanvas');
    const gctx = gridCanvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    gridCanvas.width = w * dpr;
    gridCanvas.height = h * dpr;
    gridCanvas.style.width = w + 'px';
    gridCanvas.style.height = h + 'px';
    gctx.scale(dpr, dpr);

    const patternSize = 800;
    const offCanvas = document.createElement('canvas');
    offCanvas.width = offCanvas.height = patternSize;
    const octx = offCanvas.getContext('2d');
    octx.strokeStyle = 'rgba(255,0,64,0.15)';
    octx.lineWidth = 1;
    const gridStep = 30;
    for (let x = 0; x < patternSize; x += gridStep) {
        octx.beginPath();
        octx.moveTo(x, 0);
        octx.lineTo(x, patternSize);
        octx.stroke();
    }
    for (let y = 0; y < patternSize; y += gridStep) {
        octx.beginPath();
        octx.moveTo(0, y);
        octx.lineTo(patternSize, y);
        octx.stroke();
    }
    octx.fillStyle = 'rgba(255,0,64,0.3)';
    for (let i = 0; i < 20; i++) {
        let px = Math.random() * patternSize;
        let py = Math.random() * patternSize;
        octx.beginPath();
        octx.arc(px, py, 2, 0, Math.PI*2);
        octx.fill();
    }
    const pattern = gctx.createPattern(offCanvas, 'repeat');
    gctx.fillStyle = pattern;
    gctx.fillRect(0, 0, w, h);
})();

    const phases = [
        { text: "正在连接服务器...", width: "30%", delay: 600 },
        { text: "正在解密卡密...", width: "60%", delay: 600 },
        { text: "正在验证权限...", width: "90%", delay: 600 },
        { text: "验证即将完成...", width: "100%", delay: 400 }
    ];

    function nextPhase() {
        if (phase >= phases.length) {
            // 最终验证
            const freeKami = "bbs8888";
            const validList = ["bbs888vip","bs666888ok","vip999bbs","god666888","bsvip888666", freeKami];

                titleEl.textContent = "验证成功";
                statusEl.textContent = "卡密有效，正在进入系统...";

                progressFill.style.background = "#ff0040";

                verifying = false;
            }
            return;
        }
        const p = phases[phase];
        statusEl.textContent = p.text;
        progressFill.style.width = p.width;
        phase++;
        verifyTimer = setTimeout(nextPhase, p.delay);
    }
    nextPhase();
}

const bgm = $("bgm");

let isMusicPlaying = false;

if(bgm) {

    bgm.src = "罗生门.mp3";
    bgm.addEventListener('error', function(e) {

    });
    bgm.addEventListener('play', ()=>{ isMusicPlaying=true; musicPlay.classList.add('pause'); musicCircle.classList.add('rotate'); });
    bgm.addEventListener('pause', ()=>{ isMusicPlaying=false; musicPlay.classList.remove('pause'); musicCircle.classList.remove('rotate'); });
    bgm.addEventListener('ended', ()=>{
        if (isMusicPlaying && bgm.duration > 0) {
            bgm.currentTime = 0;
            bgm.play().catch(e => { isMusicPlaying=false; musicPlay.classList.remove('pause'); musicCircle.classList.remove('rotate'); });
        } else { isMusicPlaying=false; musicPlay.classList.remove('pause'); musicCircle.classList.remove('rotate'); }
    });

function requestMusicFile() {
    return new Promise((resolve, reject) => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'audio/*';
        input.onchange = (e) => { const file = e.target.files[0]; if(file) resolve({ url: URL.createObjectURL(file), fileName: file.name }); else reject(new Error('未选择文件')); };
        input.oncancel = () => reject(new Error('取消选择'));
        input.click();
    });
}

if(musicPlay) {
    musicPlay.onclick = async ()=>{
        if(!bgm) return;
        if(isMusicPlaying) { bgm.pause(); return; }
        if(bgm.src && bgm.src !== window.location.href && bgm.duration > 0 && !isMusicPlaying) {
            try { await bgm.play(); toast("🎵 正在播放：罗生门"); return; } catch(err) { console.warn('续播失败', err); }
        }
        if(bgm.src && bgm.src.includes("罗生门.mp3") && !musicFileLoaded) {
            try { bgm.currentTime = 0; await bgm.play(); toast("🎵 正在播放：罗生门"); return; } catch(e) { console.log("需要手动选择文件"); }
        }
        try {
            toast("请选择《罗生门》MP3文件");
            const { url, fileName } = await requestMusicFile();
            if(bgm.src && bgm.src.startsWith('blob:')) URL.revokeObjectURL(bgm.src);
            bgm.src = url; musicFileLoaded = true;
            await bgm.play(); toast("🎵 正在播放：" + fileName);
        } catch(err) { if(err.message !== '取消选择') toast("❌ 未选择文件或文件无效"); }
    }
}

function generateCodeLines(){

function startCodeScroll(canvasEl, durationMs = 3000){
    const codeLines = generateCodeLines();const ctx2 = canvasEl.getContext('2d');
    const width = canvasEl.width;const height = canvasEl.height;const fontSize = 13;const lineHeight = 18;
    const visibleLines = Math.ceil(height / lineHeight) + 2;const totalLines = codeLines.length;const startTime = performance.now();
    ctx2.fillStyle = '#000';ctx2.fillRect(0, 0, width, height);
    let lastLineIdx = 0;let scrollOffset = 0;let scrollSpeed = 0;
    function render(timestamp){
        const elapsed = timestamp - startTime;
        if(elapsed >= durationMs){
            ctx2.fillStyle = '#000';ctx2.fillRect(0, 0, width, height);
            ctx2.fillStyle = '#39ff14';ctx2.font = 'bold 16px monospace';ctx2.textAlign = 'center';
            ctx2.fillText('✅ 验证完成 - 加载功能面板', width/2, height/2);ctx2.textAlign = 'start';return;
        }
        const accelPhase = Math.min(elapsed / 500, 1);scrollSpeed = 0.8 + accelPhase * 5.5;
        scrollOffset += scrollSpeed * 16;
        if(scrollOffset >= lineHeight){ const linesScrolled = Math.floor(scrollOffset / lineHeight); scrollOffset -= linesScrolled * lineHeight; lastLineIdx = (lastLineIdx + linesScrolled) % totalLines; }
        ctx2.fillStyle = '#000';ctx2.fillRect(0, 0, width, height);
        ctx2.font = `bold ${fontSize}px "Courier New", monospace`;ctx2.textAlign = 'start';
        for(let i = 0; i < visibleLines; i++){
            const lineIdx = (lastLineIdx + i) % totalLines;const y = i * lineHeight - scrollOffset + 2;
            if(y < -lineHeight || y > height + lineHeight) continue;
            const alpha = 0.4 + (i / visibleLines) * 0.6;
            if(i < 2){ ctx2.fillStyle = `rgba(57, 255, 20, ${Math.min(1, alpha + 0.3)})`; }
            else if(i < 5){ ctx2.fillStyle = `rgba(180, 255, 180, ${alpha})`; }
            else { ctx2.fillStyle = `rgba(120, 200, 120, ${Math.max(0.15, alpha - 0.15)})`; }
            ctx2.fillText(codeLines[lineIdx], 8, y + fontSize);
        }
        codeScrollAnimId = requestAnimationFrame(render);
    }
    codeScrollAnimId = requestAnimationFrame(render);
}

const optionMenu = $('optionMenu');
let longPressTimer = null;
let longPressTarget = null;
let longPressFunc = null;
const LONG_PRESS_DURATION = 600;

const funcOptions = {
    aim: ['头部', '胸部', '随机'],
    range: ['小范围', '中范围', '大范围'],
    wall: ['仅玩家', '仅物品', '全部'],

};

function getSwitchEl(funcName) {
    const map = { aim: 'switchAim', range: 'switchRange', wall: 'switchWall', skin: 'switchSkin' };
    return $(map[funcName]);
}

function showOptionMenu(funcName, targetEl, e) {
    if (floatPhase !== 'panel') { hideOptionMenu(); return; }
    const options = funcOptions[funcName] || ['开启', '关闭'];
    optionMenu.innerHTML = '';
    options.forEach(opt => {
        const item = document.createElement('div');
        item.className = 'option-item';
        item.textContent = opt;
        item.addEventListener('click', (ev) => {
            ev.stopPropagation();
            const switchEl = getSwitchEl(funcName);
            if (switchEl && !floatFuncState[funcName]) {
                floatFuncState[funcName] = true;
                switchEl.classList.add('active');
            }
            const labelEl = targetEl.querySelector('.func-label');
            if (labelEl) {
                const iconMatch = labelEl.textContent.trim().match(/^[^\s]+/);
                const icon = iconMatch ? iconMatch[0] : '';
                labelEl.textContent = `${icon} ${opt}`;
            }
            const targetRect = targetEl.getBoundingClientRect();
            const cx = targetRect.left + targetRect.width / 2;
            const cy = targetRect.top + targetRect.height / 2;
            triggerCheatEffect(cx, cy);
            toast(`✅ 已选择 ${opt}`);
            hideOptionMenu();
        });
        optionMenu.appendChild(item);
    });
    const targetRect = targetEl.getBoundingClientRect();
    optionMenu.style.opacity = '0';
    optionMenu.classList.add('show');
    const menuRect = optionMenu.getBoundingClientRect();
    let left = targetRect.left;
    let top = targetRect.bottom + 5;
    if (left + menuRect.width > window.innerWidth - 10) left = window.innerWidth - menuRect.width - 10;
    if (left < 10) left = 10;
    if (top + menuRect.height > window.innerHeight - 10) top = targetRect.top - menuRect.height - 5;
    if (top < 10) top = 10;
    optionMenu.style.left = left + 'px';
    optionMenu.style.top = top + 'px';
    requestAnimationFrame(() => { optionMenu.style.opacity = '1'; });
    if (window._optionMenuHideHandler) document.removeEventListener('pointerdown', window._optionMenuHideHandler, true);
    window._optionMenuHideHandler = function(e) { if (!optionMenu.contains(e.target)) hideOptionMenu(); };
    document.addEventListener('pointerdown', window._optionMenuHideHandler, true);
}

function hideOptionMenu() {
    optionMenu.style.opacity = '';
    optionMenu.style.transform = '';
    optionMenu.classList.remove('show');
    if (window._optionMenuHideHandler) { document.removeEventListener('pointerdown', window._optionMenuHideHandler, true); window._optionMenuHideHandler = null; }
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    longPressTarget = null; longPressFunc = null;
}

function bindLongPress() {
    const items = document.querySelectorAll('.func-item');
    items.forEach(item => {
        const funcName = item.dataset.func;
        if (!funcName) return;
        const start = (e) => {
            if (e.target.closest('.func-switch')) return;
            if (longPressTimer) clearTimeout(longPressTimer);
            longPressTarget = item;
            longPressFunc = funcName;
            longPressTimer = setTimeout(() => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                showOptionMenu(funcName, item, { clientX, clientY });
                longPressTimer = null;
                item._longPressed = true;
            }, LONG_PRESS_DURATION);
        };
        const cancel = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } if (item._longPressed) { item._longPressed = false; setTimeout(() => { item._longPressed = false; }, 0); } };
        const clickPrevent = (e) => { if (item._longPressed) { e.stopPropagation(); e.preventDefault(); item._longPressed = false; } };
        item.addEventListener('mousedown', start);
        item.addEventListener('touchstart', start, { passive: true });
        item.addEventListener('mouseup', cancel);
        item.addEventListener('mouseleave', cancel);
        item.addEventListener('touchend', cancel);
        item.addEventListener('touchcancel', cancel);
        item.addEventListener('click', clickPrevent, true);
    });
}

const observer = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
        if (mutation.target.id === 'funcPanel' && mutation.target.style.display === 'flex') setTimeout(bindLongPress, 100);
    });
});

        const rect = chatContainer.getBoundingClientRect();
        initLeft = rect.left; initTop = rect.top;
        chatContainer.style.transition = 'none';
        e.preventDefault();
    });
    chatHeader.addEventListener('touchstart', (e) => {
        isDragging = true;
        const t = e.touches[0];
        startX = t.clientX; startY = t.clientY;
        const rect = chatContainer.getBoundingClientRect();
        initLeft = rect.left; initTop = rect.top;
        chatContainer.style.transition = 'none';
    }, {passive: false});
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let nx = initLeft + (e.clientX - startX);
        let ny = initTop + (e.clientY - startY);
        nx = Math.max(0, Math.min(nx, window.innerWidth - chatContainer.offsetWidth));
        ny = Math.max(0, Math.min(ny, window.innerHeight - chatContainer.offsetHeight));
        chatContainer.style.position = 'fixed';
        chatContainer.style.left = nx + 'px';
        chatContainer.style.top = ny + 'px';
        chatContainer.style.margin = '0';
    });
    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const t = e.touches[0];
        let nx = initLeft + (t.clientX - startX);
        let ny = initTop + (t.clientY - startY);
        nx = Math.max(0, Math.min(nx, window.innerWidth - chatContainer.offsetWidth));
        ny = Math.max(0, Math.min(ny, window.innerHeight - chatContainer.offsetHeight));
        chatContainer.style.position = 'fixed';
        chatContainer.style.left = nx + 'px';
        chatContainer.style.top = ny + 'px';
        chatContainer.style.margin = '0';
    }, {passive: false});
    document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; chatContainer.style.transition = ''; } });
    document.addEventListener('touchend', () => { if (isDragging) { isDragging = false; chatContainer.style.transition = ''; } });
}

function closeChat() {
    $('chatModal').classList.remove('show');
    if (chatInterval) { clearInterval(chatInterval); chatInterval = null; }

// ==================== 创始统计 ====================
const APP_START_DATE = new Date(2026, 4, 1); // 2026年5月1日（月份从0开始）

function updateAppInfo() {
  const now = new Date();
  const diffMs = now - APP_START_DATE;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  
  let timeStr;
  if (diffDays < 1) {
    timeStr = "不足1天";
  } else if (diffDays < 30) {
    timeStr = diffDays + " 天";
  } else if (diffDays < 365) {
    const months = Math.floor(diffDays / 30);
    timeStr = months + " 个月";
  } else {
    const years = Math.floor(diffDays / 365);
    const remainingDays = diffDays % 365;
    const months = Math.floor(remainingDays / 30);
    timeStr = years + " 年" + (months > 0 ? " " + months + " 个月" : "");
  }
  
  const el = document.getElementById("appInfo");
  if (el) {
    el.innerHTML = `本APP已存在 ${timeStr}｜创始于2026年5月1日｜创始人：念旧`;
  }
}
